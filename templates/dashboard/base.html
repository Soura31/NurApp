{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 grid lg:grid-cols-[280px,1fr] gap-6">
  <aside>
    <div class="rounded-3xl border border-[#c9a84c]/20 bg-[#0d1117] p-5 sticky top-28">
      <h2 class="font-cinzel text-2xl nur-gold-text">Dashboard</h2>
      <p class="text-[#8b949e] text-sm mt-2">Suivi personnel NurCoran</p>
      <nav class="mt-6 space-y-2 text-sm">
        <a class="block rounded-2xl px-4 py-3 border border-white/5 text-white hover:border-[#c9a84c]/35 hover:text-[#c9a84c]" href="{% url 'dashboard:home' %}">Accueil</a>
        <a class="block rounded-2xl px-4 py-3 border border-white/5 text-white hover:border-[#c9a84c]/35 hover:text-[#c9a84c]" href="{% url 'dashboard:subscription' %}">Abonnement</a>
        <a class="block rounded-2xl px-4 py-3 border border-white/5 text-white hover:border-[#c9a84c]/35 hover:text-[#c9a84c]" href="{% url 'dashboard:favorites' %}">Favoris</a>
        <a class="block rounded-2xl px-4 py-3 border border-white/5 text-white hover:border-[#c9a84c]/35 hover:text-[#c9a84c]" href="{% url 'dashboard:bookmarks' %}">Signets</a>
        <a class="block rounded-2xl px-4 py-3 border border-white/5 text-white hover:border-[#c9a84c]/35 hover:text-[#c9a84c]" href="{% url 'dashboard:invoices' %}">Factures</a>
        <a class="block rounded-2xl px-4 py-3 border border-white/5 text-white hover:border-[#c9a84c]/35 hover:text-[#c9a84c]" href="{% url 'dashboard:profile' %}">Profil</a>
        <a class="block rounded-2xl px-4 py-3 border border-white/5 text-white hover:border-[#c9a84c]/35 hover:text-[#c9a84c]" href="/badges/">Badges</a>
        <a class="block rounded-2xl px-4 py-3 border border-white/5 text-white hover:border-[#c9a84c]/35 hover:text-[#c9a84c]" href="/parametres/notifications/">Notifications</a>
      </nav>
    </div>
  </aside>
  <section>
    {% block dashboard_content %}{% endblock %}
  </section>
</div>
{% endblock %}
